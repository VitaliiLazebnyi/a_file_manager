# The Xcode project of the UI tests, generated by XcodeGen (`UITests/run.sh` does it; the
# generated AFileManagerUITests.xcodeproj is not kept in git). It holds one target: the UI test
# bundle. The program itself is not built here: Scripts/build-app.sh builds it from the Swift
# package, which stays the one description of the program, and the tests start that bundle.
name: AFileManagerUITests
options:
  bundleIdPrefix: local.a-file-manager
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AFileManagerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - AFileManagerUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Not ".runner": the container of that one was taken over by a runner signed with a
        # certificate once (2026-10-21), and the program may no longer read the test folders in it.
        PRODUCT_BUNDLE_IDENTIFIER: local.a-file-manager.uitests.tests
schemes:
  AFileManagerUITests:
    build:
      targets:
        AFileManagerUITests: [test]
    test:
      targets:
        - AFileManagerUITests
