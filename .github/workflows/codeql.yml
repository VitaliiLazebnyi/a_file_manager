# CodeQL security analysis of the Swift code, on every push to main, every pull request and weekly.
# Findings appear under Security › Code scanning. The same queries run locally as the `codeql` gate of
# Scripts/check.sh, which fails on any finding.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      # The same build as the `codeql` gate of Scripts/check.sh: CodeQL's tracer does not follow the
      # default build system's build service, and SwiftPM's sandbox (sandbox-exec) has no Intel
      # slice for the Intel-only extractor to start.
      - name: Build
        run: swift build --build-tests --build-system native --disable-sandbox

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:swift
